<title>המילים של נועה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: one soft phone column; white cards on powder-pink paper, cherry red only for the main action. Direction "ורוד אבקה" (single light look by design) */
:root{
  --bg:#F7EAE4; --surface:#FFFFFF; --paper:#FFFFFF; --ink:#3B2724; --muted:#8C6F68; --line:#F0DDD6; --line2:#E7CFC6;
  --pop:#D6334C; --pop-ink:#FFFFFF; --mint:#F7EAE4; --sun:#FCE3DF; --sky:#D6334C;
  --deck:#FFFFFF; --deck-ink:#B0857B;
  --good:#2E8A63; --good-bg:#E3F4EA; --bad:#C8384F; --bad-bg:#FBE1E4; --warn-bg:#FCEDE6;
  --shadow:none;
  --f-display:"Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-en:"Outfit","Rubik",system-ui,sans-serif;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.3rem;font-weight:600} h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-display)}
.muted{color:var(--muted)} .small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--line);color:var(--ink);font-weight:500;min-height:46px;transition:transform .08s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn-pop{background:var(--pop);color:var(--pop-ink);font-family:var(--f-display);font-weight:600;font-size:1.1rem;box-shadow:0 4px 0 color-mix(in srgb,var(--pop) 60%,#000)}
.btn-mint{background:var(--mint);color:#fff;font-weight:600;box-shadow:0 4px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.btn-ghost{background:transparent;border:2px solid var(--line)}
.btn-wide{width:100%}
.btn-icon{width:46px;padding:0;display:grid;place-items:center;font-size:1.25rem}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
textarea{min-height:130px;resize:vertical}
label{font-weight:500;font-size:.95rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:transparent;padding:8px 4px;min-height:40px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.82rem;font-weight:500;background:var(--line)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.lock{background:var(--warn-bg)} .chip.sun{background:var(--sun);color:#3a2a00}
.hello{padding:18px;border-radius:24px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hello h1{font-size:2rem}
.hello .blob{position:absolute;inset-inline-end:-40px;top:-50px;width:120px;height:120px;border-radius:50%;background:var(--pop);opacity:.85}
.hello .blob2{position:absolute;inset-inline-end:50px;top:-26px;width:44px;height:44px;border-radius:50%;background:var(--sun)}
.hello > *{position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:14px;padding:8px 10px}
.stat b{font-family:var(--f-display);font-size:1.4rem;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;opacity:.85}
.deck{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;text-align:start;width:100%;font-weight:400}
.deck .name{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:16px}
.tabs button{background:transparent;min-height:42px;padding:8px 4px;font-size:.92rem}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 30%;background:var(--bg);border:2px solid var(--line);min-height:44px;padding:8px}
.seg button[aria-pressed="true"]{border-color:var(--pop);background:color-mix(in srgb,var(--pop) 12%,var(--surface));font-weight:700}
.wl{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.wrow input{min-height:42px;padding:8px 10px}
.wrow .en input,.wrow input.en{direction:ltr;text-align:left}
.tip{background:var(--warn-bg);border-radius:14px;padding:12px;font-size:.92rem}
/* flashcard */
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:10px}
.scene{perspective:1200px}
.card{position:relative;height:270px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;box-shadow:var(--shadow)}
.front{background:var(--surface);border:3px solid var(--line)}
.face-back{transform:rotateY(180deg);background:var(--ink);color:var(--bg)}
.face-back.good{background:var(--good);color:#fff} .face-back.bad{background:var(--bad);color:#fff}
.word{font-size:clamp(2rem,9vw,2.8rem);font-weight:600;line-height:1.1;word-break:break-word}
.word-he{font-family:var(--f-display);font-size:clamp(1.8rem,8vw,2.4rem);font-weight:600}
.face .hint{font-size:.85rem;opacity:.7}
.face .ex{font-size:1rem;opacity:.95;max-width:34ch}
.speak{background:var(--sun);color:#3a2a00;border-radius:50%;width:56px;height:56px;padding:0;font-size:1.5rem;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.face-back .speak{width:46px;height:46px;font-size:1.2rem}
.answer input{font-size:1.15rem;text-align:center}
.answer input.en{direction:ltr}
.feedback{border-radius:14px;padding:12px 14px;font-weight:500;text-align:center}
.feedback.good{background:var(--good-bg);color:var(--good)} .feedback.bad{background:var(--bad-bg);color:var(--bad)} .feedback.close{background:var(--warn-bg)}
/* results */
.score{font-family:var(--f-display);font-size:4.5rem;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.stars{font-size:2rem;text-align:center;letter-spacing:4px}
.cheer{font-family:var(--f-display);font-size:1.25rem;text-align:center;font-weight:500;line-height:1.45}
.mist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
/* stage 2 */
.sentence{font-size:1.35rem;line-height:1.9;direction:ltr;text-align:left;font-family:var(--f-display)}
.sentence .tok{cursor:pointer;border-radius:6px;padding:0 1px}
.sentence .tok:hover{background:var(--line)}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--pop);text-align:center;color:var(--pop);font-weight:600}
.blank.ok{border-color:var(--good);color:var(--good)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank button{direction:ltr;font-family:var(--f-display);font-size:1.1rem;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-width:90px}
.bank button.right{background:var(--good);border-color:var(--good);color:#fff}
.bank button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pop{position:fixed;inset-inline:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;z-index:20}
.pop .row button{min-height:40px;padding:8px 12px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:0;margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-weight:500}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25}
.filebtn{flex:1;display:flex;align-items:center;justify-content:center;border-radius:14px;min-height:52px;padding:10px;cursor:pointer;font-weight:600;text-align:center}
.filebtn.btn-ghost{border:2px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.switch input{width:52px;min-height:28px;height:28px;accent-color:var(--pop)}
code.share{display:block;direction:ltr;word-break:break-all;font-size:.75rem;background:var(--bg);padding:10px;border-radius:10px;max-height:110px;overflow:auto}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.pulse{animation:pulse .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s ease 2}
@media (prefers-reduced-motion:reduce){.card{transition:none}.pulse,.shake{animation:none}}

/* ---- sorbet overrides ---- */
h1{font-weight:700;letter-spacing:-.3px} h2,h3{font-weight:700}
.panel{background:var(--surface);border:0}
button{background:var(--line);color:var(--ink)}
.btn-pop{box-shadow:none;font-weight:800;font-family:var(--f-body);border-radius:18px}
.btn-mint{background:var(--mint);color:var(--pop);box-shadow:none;font-weight:700}
.btn-ghost{border-color:var(--line2);color:var(--ink);background:var(--surface)}
input,textarea,select{background:var(--surface);border:2px solid var(--line)}
.chip{background:var(--line);color:var(--ink)} .chip.good{background:var(--good-bg);color:var(--good)} .chip.lock{background:var(--sun);color:#6B4316}
.hello{background:transparent;color:var(--ink);padding:8px 4px 0;overflow:visible}
.hello h1{font-size:2.1rem}
.hello .blob,.hello .blob2{display:none}
.hello p{color:var(--muted)}
.stats{gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:12px}
.stat b{font-family:var(--f-en);font-size:1.6rem;font-weight:700}
.stat span{color:var(--muted);opacity:1}

<script>
'use strict';
/* ============ storage ============ */
const KEY='noa-english-v1';
const DEFAULT_SETTINGS={name:'נועה',stage1Mode:'meaning',bankSize:5,bankSource:'deck',autoSpeak:false,rate:0.7,voiceURI:'',threshold:90};
let S=load();
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!s){s={settings:{...DEFAULT_SETTINGS},decks:[],streak:{last:'',days:0},sampleAdded:false}}
  s.settings={...DEFAULT_SETTINGS,...s.settings};
  if(!s.v7){s.settings.autoSpeak=false;s.settings.rate=Math.min(+s.settings.rate||0.7,0.7);s.v7=true}
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=sel=>document.querySelector(sel);
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ============ dictionary ============ */
let DICT=new Map(), DICT_LIST=[];
let ALL_SENTS=[];
const dictReady=Promise.resolve(typeof DICT_TXT!=='undefined'?DICT_TXT:'').then(t=>{
  t.split('\n').forEach(line=>{const p=line.split('|');if(p.length<3||!p[0])return;
    const w=p[0].trim(), k=w.toLowerCase(); if(DICT.has(k))return;
    const exs=p.slice(3).join('|').split('||').map(x=>x.trim()).filter(Boolean);
    const e={en:w,pos:p[1],he:p[2].split(';').map(x=>x.trim()).filter(Boolean),ex:exs[0]||'',exs};ALL_SENTS.push(...exs);
    DICT.set(k,e); if(e.ex)DICT_LIST.push(e);
  });
}).catch(()=>{});
function lemmas(w){
  w=w.toLowerCase().replace(/[^a-z'\- ]/g,'').trim(); const out=[w];
  if(w.endsWith("'s"))out.push(w.slice(0,-2));
  if(w.endsWith('ies'))out.push(w.slice(0,-3)+'y');
  if(w.endsWith('ied'))out.push(w.slice(0,-3)+'y');
  if(w.endsWith('es'))out.push(w.slice(0,-2));
  if(w.endsWith('s'))out.push(w.slice(0,-1));
  if(w.endsWith('ed')){out.push(w.slice(0,-2));out.push(w.slice(0,-1));if(/(.)\1ed$/.test(w))out.push(w.slice(0,-3))}
  if(w.endsWith('ing')){out.push(w.slice(0,-3));out.push(w.slice(0,-3)+'e');if(/(.)\1ing$/.test(w))out.push(w.slice(0,-4))}
  if(w.endsWith('er'))out.push(w.slice(0,-2));
  if(w.endsWith('ly'))out.push(w.slice(0,-2));
  return out;
}
function lookup(w){for(const l of lemmas(w)){const e=DICT.get(l);if(e)return e}return null}

/* ============ speech ============ */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function bestVoice(){
  if(S.settings.voiceURI){const v=voices.find(v=>v.voiceURI===S.settings.voiceURI);if(v)return v}
  const pref=[/Google US English/i,/Samantha/i,/Ava/i,/Allison/i,/en[-_]US/i,/Daniel/i,/en[-_]GB/i];
  for(const re of pref){const v=voices.find(v=>re.test(v.name)||re.test(v.lang));if(v)return v}
  return voices[0]||null;
}
let ttsBroken=false,ttsAudio=null;
const IS_APPLE=/iPhone|iPad|Macintosh/.test(navigator.userAgent);
function speakNet(text,rate){
  // fallback when the phone has no built-in English voice (e.g. a file opened inside an in-app viewer)
  try{if(ttsAudio){ttsAudio.pause()}
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&ttsspeed='+(rate<0.8?'0.3':'1')+'&q='+encodeURIComponent(String(text).slice(0,190)));
    ttsAudio=a;a.onerror=()=>speechHelp();try{a.preservesPitch=true;a.playbackRate=Math.max(0.5,Math.min(1.2,rate/0.9))}catch(e){}
    const pr=a.play();if(pr&&pr.catch)pr.catch(err=>{if(err&&err.name==='NotAllowedError')toast('לחצי שוב על ▶');else speechHelp()});
  }catch(e){speechHelp()}
}
let helpShown=0;
function speechHelp(){if(Date.now()-helpShown<8000)return;helpShown=Date.now();

  toast('ההקראה לא עובדת כאן. כדאי לפתוח את הקובץ בדפדפן כרום (או ספארי באייפון) ולא בתוך וואטסאפ.')}
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(navigator.userAgent);
function rateLabel(r){r=+r;return r<0.5?'איטי מאוד':r<0.7?'איטי':r<0.9?'רגיל':r<1.05?'מהיר':'מהיר מאוד'}
function engineRate(r){
  // phones speak much faster than desktop at the same number: iPhone 1.0 is very fast, Android a bit fast
  r=+r||0.7; return Math.max(0.1,Math.min(2,IS_IOS?r*0.55:IS_ANDROID?r*0.8:r));
}
function speak(text,rate){
  rate=+(rate||S.settings.rate)||0.7;
  const ss=('speechSynthesis' in window)?window.speechSynthesis:null;
  if(!ss||ttsBroken){speakNet(text,rate);return}
  try{
    loadVoices();
    if(ss.speaking||ss.pending)ss.cancel();
    const u=new SpeechSynthesisUtterance(text);const v=bestVoice();
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
    u.rate=engineRate(rate);
    let started=false;
    u.onstart=()=>{started=true};
    u.onerror=e=>{if(!started&&!/interrupted|canceled/.test(e.error||'')){ttsBroken=true;speakNet(text,rate)}};
    ss.resume();ss.speak(u);
    // some phones accept speak() but never say anything: detect and switch to the fallback
    setTimeout(()=>{if(!started&&!ss.speaking){ttsBroken=true;try{ss.cancel()}catch(e){};speakNet(text,rate)}},1800);
  }catch(e){ttsBroken=true;speakNet(text,rate)}
}

/* ============ matching ============ */
const FINALS={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function normHe(s){return String(s||'').replace(/[֑-ׇ]/g,'').replace(/\([^)]*\)/g,' ').replace(/[ךםןףץ]/g,c=>FINALS[c]).replace(/[^א-תa-z0-9 ]/gi,' ').replace(/\s+/g,' ').trim()}
const skel=s=>s.replace(/[וי]/g,'');
const stripPre=s=>s.split(' ').map(w=>w.length>3?w.replace(/^[הולבשמכ]/,''):w).join(' ');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function rootKey(x){
  // rough Hebrew root: drop infinitive ל, common endings and vowel letters, so אהבה / לאהוב / אוהב / אוהבת all meet
  x=x.replace(/ /g,'');
  if(x.length>3&&/^ל/.test(x))x=x.slice(1);
  if(x.length>4&&/^(מת|הת|נת)/.test(x))x=x.slice(2);
  else if(x.length>4&&/^[מהנת]/.test(x))x=x.slice(1);
  x=x.replace(/(ים|ות|ית|ה|ת)$/,'');
  return x.replace(/[ויא]/g,'');
}
function closeEnough(a,b){
  if(!a||!b)return false; if(a===b)return true;
  const short=Math.min(a.length,b.length)<3;
  {const ra=rootKey(a),rb=rootKey(b);if(!short&&ra.length>=2&&ra===rb&&a.split(' ').length===1&&b.split(' ').length===1)return true}
  if(stripPre(a)===stripPre(b)||(!short&&(skel(a)===skel(b)||skel(stripPre(a))===skel(stripPre(b)))))return true;
  const L=Math.max(a.length,b.length), d=lev(a,b);
  if((L>=4&&d<=1)||(L>=7&&d<=2))return true;
  const [s,l]=a.length<b.length?[a,b]:[b,a];
  if(s.length>=3&&l.includes(s)&&s.length/l.length>=.55)return true;
  return false;
}
/* returns 'exact' | 'close' | 'wrong' */
function checkMeaning(answer,meaning){
  const a=normHe(answer); if(!a)return 'wrong';
  const opts=String(meaning).split(/[;,/]|\s-\s/).map(normHe).filter(Boolean);
  for(const o of opts){if(a===o)return 'exact'}
  for(const o of opts){if(closeEnough(a,o)||(/^ל/.test(o)&&o.length>3&&closeEnough(a,o.slice(1))))return 'close';
    const aw=a.split(' '),ow=o.split(' ');
    if(ow.length>1&&aw.some(x=>x.length>=3&&ow.some(y=>closeEnough(x,y)))&&aw.length<=ow.length+1)return 'close';
    if(aw.length>1&&aw.some(x=>x.length>=3&&closeEnough(x,o)))return 'close';
  }
  return 'wrong';
}
function checkSpelling(answer,word){
  const a=String(answer).trim().toLowerCase().replace(/\s+/g,' '), w=String(word).trim().toLowerCase();
  if(a===w)return 'exact'; if(w.length>=3&&lev(a,w)===1)return 'almost'; return 'wrong';
}

function mkDeck(name,words,sample){return {id:uid(),name,created:Date.now(),words,stats:{},history:[],unlocked:false,best:{meaning:0,spelling:0,both:0,stage2:0},sample:!!sample}}

/* ============ streak ============ */
function bumpStreak(){
  const t=today(); if(S.streak.last===t)return;
  S.streak.days=S.streak.last===yesterday()?S.streak.days+1:1; S.streak.last=t;
}
function greet(){const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'}
const DECK_COLORS=[['#FFFFFF','#B0857B']];
function deckStyle(d){const i=Math.max(0,S.decks.indexOf(d))%DECK_COLORS.length;const c=DECK_COLORS[i];return `--deck:${c[0]};--deck-ink:${c[1]}`}
function setDeckColor(d){const st=d?deckStyle(d):'';document.getElementById('app').setAttribute('style',st)}
function wordLevel(d,w){const s=d.stats[w.en]||{};if(s.lastWrong)return 'again';const s1=(s.streak||0)>=1;if(s1&&s.s2)return 'on';if(s1)return 'half';return ''}
function masteredCount(d){return d.words.filter(w=>wordLevel(d,w)==='on').length}
function stageInfo(d,st){const h=(d.history||[]).filter(x=>x.stage===st&&(st===2||x.full!==false));
  return {n:h.length,last:h.length?h[h.length-1].score:null,best:h.reduce((a,x)=>Math.max(a,x.score),0)}}
const rounds=n=>n===1?'סבב אחד':n+' סבבים';
function stageLine(i){return i.n?`<p class="small" style="font-weight:600">עשית ${i.n===1?'סבב אחד':i.n+' סבבים'} · ציון אחרון ${i.last}% · שיא ${i.best}%</p>`:'<p class="small muted">עוד לא עשית את השלב הזה.</p>'}
const stage2Done=d=>(d.best.stage2||0)>=S.settings.threshold;
const missingHe=d=>d.words.filter(w=>!String(w.he||'').trim());

function parseWords(text){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    line=line.replace(/^\s*[\d]+[.)\-]?\s*/,'').trim(); if(!line)return;
    const hasHe=/[א-ת]/.test(line);
    if(hasHe){
      let m=line.match(/^([A-Za-z][A-Za-z' \-]*?)\s*[-–—=:\t|]?\s*([א-ת].*)$/)||line.match(/^([א-ת][^A-Za-z]*?)\s*[-–—=:\t|]?\s*([A-Za-z][A-Za-z' \-]*)$/);

      return;
    }
    const m2=line.match(/^([A-Za-z][A-Za-z' ]*?)\s*[-–—=:]\s*(.+)$/);
    if(m2&&!/[,;]/.test(m2[1])){out.push({en:m2[1].trim().toLowerCase(),he:m2[2].trim()});return}
    line.split(/[,;•·]+|\s{2,}|\t/).forEach(tok=>{tok=tok.trim().replace(/[^A-Za-z' \-]/g,'').trim();

function parseOcr(text){

    const toks=m&&line.split(/\s+/).length<=4?[m[1]]:(line.match(/[A-Za-z][A-Za-z'\-]{2,}/g)||[]);
    toks.forEach(t=>{const k=t.toLowerCase();if(!seen.has(k)){seen.add(k);words.push({en:k,he:''})}});
  });

}
async function addToDraft(list){

  syncDraftInputs();render();

let ocrWorker=null;const CDN='https://cdn.jsdelivr.net/npm/';const LOCAL_OCR=!(typeof SINGLE_FILE!=='undefined'&&SINGLE_FILE)&&/^https?:$/.test(location.protocol);
function ocrUI(state,msg,pct){
  const el=$('#ocrstat');if(!el)return;
  if(state==='idle'){el.innerHTML='';return}
  if(state==='busy')el.innerHTML=`<div class="ocrbox" role="status"><div class="spin" aria-hidden="true"></div><div style="flex:1;min-width:0"><b>${esc(msg)}</b><div class="bar" style="margin-top:8px"><i style="width:${pct==null?8:Math.max(4,pct)}%"></i></div></div></div>`;
  if(state==='error')el.innerHTML=`<div class="ocrbox err" role="alert"><div style="flex:1;min-width:0"><b>${esc(msg)}</b><p class="small" style="margin-top:6px">הדרך שתמיד עובדת: מצלמים עם Google Lens, מעתיקים את הטקסט ומדביקים בלשונית הקלדה.</p><button class="btn-mint" data-tab="type" style="margin-top:10px;width:100%">ללשונית הקלדה</button></div></div>`;
}
function withTimeout(pr,ms,label){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout:'+label)),ms))])}
async function shrinkImage(file){
  // phone photos are huge (12MP+); scale to max 1800px and grayscale for faster, steadier OCR
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.2)';x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return c;
  }catch(e){return file}
}
async function makeWorker(onProg){
  const base=new URL('./',location.href).href;
  const local={workerPath:base+'worker.min.js',corePath:base,langPath:base.replace(/\/$/,''),cacheMethod:'none'};
  const cdn={workerPath:CDN+'tesseract.js@5.1.1/dist/worker.min.js',corePath:CDN+'tesseract.js-core@5.1.1',langPath:CDN+'@tesseract.js-data/eng@1.0.0/4.0.0_best_int'};
  const attempts=LOCAL_OCR?[{...local,workerBlobURL:false},{...local,workerBlobURL:true}]:[cdn];
  let lastErr;
  for(const opt of attempts){
    try{return await withTimeout(Tesseract.createWorker('eng',1,{...opt,logger:onProg,errorHandler:e=>console.error(e)}),60000,'worker')}
    catch(e){lastErr=e;console.error('OCR worker attempt failed',e)}
  }
  throw lastErr||new Error('no worker');
}
async function runOcr(files){
  if(!files.length)return;
  ocrUI('busy','מכינה את התמונה…',5);
  try{
    if(!window.Tesseract){ocrUI('busy','טוענת את מנוע הזיהוי…',10);
      await withTimeout(loadScript(LOCAL_OCR?'tesseract.min.js':CDN+'tesseract.js@5.1.1/dist/tesseract.min.js'),30000,'script')}
    if(!ocrWorker){ocrUI('busy','מכינה את הזיהוי בפעם הראשונה. זה לוקח כמה שניות…',20);
      ocrWorker=await makeWorker(m=>{if(m.status==='recognizing text')ocrUI('busy','מזהה מילים מהתמונה…',30+Math.round(m.progress*70))})}
    let all=[];
    for(let i=0;i<files.length;i++){
      ocrUI('busy',files.length>1?`מזהה מילים מתמונה ${i+1} מתוך ${files.length}…`:'מזהה מילים מהתמונה…',30);
      const img=await shrinkImage(files[i]);
      const {data}=await withTimeout(ocrWorker.recognize(img),90000,'recognize');
      all=all.concat(parseOcr(data.text||''));
    }
    ocrUI('idle');
    if(!all.length){ocrUI('error','לא מצאתי מילים באנגלית בתמונה. כדאי לצלם קרוב יותר, ישר ובתאורה טובה.');return}
    syncDraftInputs();await addToDraft(all);
  }catch(err){console.error(err);
    try{if(ocrWorker){ocrWorker.terminate()}}catch(e){} ocrWorker=null;
    const net=!LOCAL_OCR||/script|Failed to fetch|NetworkError/i.test(String(err&&err.message));
    ocrUI('error',net&&!LOCAL_OCR?'הזיהוי לא נטען. בפעם הראשונה צריך חיבור לאינטרנט.':'הזיהוי האוטומטי לא הצליח בטלפון הזה.');
  }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

BIND.import=()=>{$('#app').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back')go('home');
  if(b.dataset.act==='doimp'){try{const raw=$('#imp').value.trim();const o=raw.startsWith('{')?JSON.parse(raw):decodeShare(raw);await dictReady;
    if(o.backup){S={...o.backup,settings:{...DEFAULT_SETTINGS,...o.backup.settings}};save();toast('הגיבוי שוחזר ✓');go('home');return}

/* ============ STAGE 1 ============ */
let R=null; // current round
function startStage1(d,mode,onlyWrong){
  let words=d.words.slice(); if(onlyWrong)words=words.filter(w=>d.stats[w.en]?.lastWrong);
  if(!words.length){toast('אין מילים לתרגל');return}
  let items=[];
  words.forEach(w=>{if(mode!=='spelling')items.push({w,dir:'meaning'});if(mode!=='meaning')items.push({w,dir:'spelling'})});
  items=shuffle(items);
  R={deck:d.id,mode,full:!onlyWrong,items,i:0,results:[],state:'ask',started:Date.now()};
  go('s1');
}
VIEWS.s1=()=>{

  <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${R.i+1}/${R.items.length}</span></div>
  <div class="scene"><div class="card ${st!=='ask'?'flipped':''}" id="card">
    <div class="face front">

      <span class="hint">לחיצה ארוכה הופכת את הכרטיסייה</span>
    </div>
    <div class="face face-back ${res==='exact'||res==='close'?'good':res?'bad':''}">
      <div class="word en">${esc(w.en)}</div>
      <div class="word-he" style="font-size:1.5rem">${esc(w.he)}</div>
      ${ex?`<div class="ex en">${esc(ex)}</div>`:''}
      <button class="speak" data-act="say" aria-label="השמעה">▶</button>
    </div>
  </div></div>
  ${st==='ask'?`
  <form class="answer stack" id="ansf" autocomplete="off">
    <input id="ans" class="${isM?'':'en'}" placeholder="${isM?'כתבי את הפירוש בעברית':'type the English word'}" ${isM?'dir="rtl"':'dir="ltr" autocapitalize="off" spellcheck="false" autocorrect="off"'} aria-label="תשובה">
    <div class="row" style="flex-wrap:nowrap"><button type="submit" class="btn-pop" style="flex:2">בדיקה</button><button type="button" class="btn-ghost" data-act="idk" style="flex:1">לא יודעת</button></div>
  </form>`:`
  <div class="feedback ${res==='exact'?'good':res==='close'?'close':'bad'}">${R.msg}</div>

  <button class="btn-pop btn-wide" data-act="next" id="nextbtn">${R.i+1<R.items.length?'הבא ←':'לתוצאות'}</button>`}`;
};
BIND.s1=()=>{
  const it=R.items[R.i];
  const sayIt=()=>speak(it.w.en);
  if(R.state==='ask'){
    if(S.settings.autoSpeak&&it.dir==='meaning'&&R.userTapped)setTimeout(sayIt,250);
    const f=$('#ansf');f.onsubmit=ev=>{ev.preventDefault();answerS1($('#ans').value)};
    const a=$('#ans');
    // phone keyboard: shrink the card and keep the answer box and button in view
    const keep=()=>{const fm=$('#ansf');if(fm)fm.scrollIntoView({block:'end',behavior:'smooth'})};
    a.onfocus=()=>{document.body.classList.add('typing');setTimeout(keep,250);setTimeout(keep,600)};
    a.onblur=()=>setTimeout(()=>{if(document.activeElement!==a)document.body.classList.remove('typing')},150);
    if(window.visualViewport)visualViewport.onresize=()=>{if(document.activeElement===a)keep()};
    setTimeout(()=>{if(a)a.focus({preventScroll:true})},50);
  }else{document.body.classList.remove('typing');const nb=$('#nextbtn');if(nb)setTimeout(()=>nb.focus({preventScroll:true}),50)}
  // long press flips the card
  const card=$('#card');let lp=null,moved=false;
  if(card){
    const start=ev=>{if(ev.target.closest('button'))return;moved=false;clearTimeout(lp);card.classList.add('pressing');
      lp=setTimeout(()=>{card.classList.remove('pressing');try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
        if(R.state==='ask')answerS1('',true);else card.classList.toggle('flipped')},450)};
    const stop=()=>{clearTimeout(lp);card.classList.remove('pressing')};
    card.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(t=>card.addEventListener(t,stop));
    card.addEventListener('pointermove',ev=>{if(Math.abs(ev.movementX)+Math.abs(ev.movementY)>6)stop()});
    card.addEventListener('contextmenu',ev=>ev.preventDefault());
  }
  $('#app').onclick=e=>{R.userTapped=true;const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
    if(a==='say'){e.stopPropagation();sayIt();return}
    if(a==='flip'){if(R.state==='ask'){answerS1('',true)}return}
    if(a==='idk'){answerS1('',true);return}
    if(a==='quit'){go('deck',{id:R.deck});return}
    if(a==='override'){R.results[R.results.length-1].ok=true;R.last='close';R.msg='סבבה, ספרתי את זה כנכון';
      const d=deckById(R.deck);const s=d.stats[it.w.en];if(s){s.lastWrong=false;s.streak=(s.streak||0)+1}save();render();return}
    if(a==='next'){R.i++;R.state='ask';R.last=null;R.typed='';if(R.i>=R.items.length)finishS1();else render()}
  };
};
function answerS1(val,gaveUp){
  const it=R.items[R.i];let res;
  if(gaveUp)res='wrong';
  else if(it.dir==='meaning')res=checkMeaning(val,it.w.he+';'+((lookup(it.w.en)||{}).he||[]).join(';'));
  else{const r=checkSpelling(val,it.w.en);res=r==='exact'?'exact':'wrong';if(r==='almost')R.almost=true}
  const ok=res!=='wrong';
  R.typed=val;R.last=res;R.state='shown';
  R.msg=ok?(res==='close'?`${pick(OK_SHORT)} התשובה המלאה: ${esc(it.w.he)}`:pick(OK_SHORT))
         :gaveUp?'הנה התשובה. נחזור למילה הזאת עוד מעט'
         :(it.dir==='spelling'&&checkSpelling(val,it.w.en)==='almost')?`כמעט! רק אות אחת. כתבת <span class="en">${esc(val)}</span>`:pick(BAD_SHORT);
  R.results.push({w:it.w,dir:it.dir,ok,typed:val});
  const d=deckById(R.deck);const s=d.stats[it.w.en]||(d.stats[it.w.en]={c:0,x:0,streak:0});
  if(ok){s.c++;s.streak++;s.lastWrong=false}else{s.x++;s.streak=0;s.lastWrong=true}
  save();render();
  if(S.settings.autoSpeak)setTimeout(()=>speak(it.w.en),350);
  const c=$('#card');if(c&&!ok)c.classList.add('shake');
}
function finishS1(){
  const d=deckById(R.deck);const n=R.results.length,ok=R.results.filter(r=>r.ok).length;
  const p=Math.round(ok/n*100);
  bumpStreak();
  d.history.push({date:Date.now(),stage:1,mode:R.mode,score:p,total:n,full:R.full});
  let newUnlock=false;
  if(R.full){d.best[R.mode]=Math.max(d.best[R.mode]||0,p);
    if(!d.unlocked&&R.mode===S.settings.stage1Mode&&p>=S.settings.threshold){d.unlocked=true;newUnlock=true}
    if(!d.unlocked&&S.settings.stage1Mode!=='both'&&R.mode==='both'&&p>=S.settings.threshold){d.unlocked=true;newUnlock=true}}
  save();
  go('result',{stage:1,p,ok,n,newUnlock,mistakes:R.results.filter(r=>!r.ok)});
}

/* ---- results ---- */

/* ============ STAGE 2 ============ */
const SUFFIXES=['','s','es','ed','d','ing','ies','ied'];
function inflect(base,suffix){
  if(!suffix)return base; const b=base.toLowerCase();
  if(suffix==='ies'||suffix==='ied')return /[^aeiou]y$/.test(b)?b.slice(0,-1)+suffix:b+(suffix==='ies'?'s':'ed');
  if(suffix==='ing')return /[^aeiou]e$/.test(b)?b.slice(0,-1)+'ing':b+'ing';
  if(suffix==='ed'||suffix==='d')return b.endsWith('e')?b+'d':/[^aeiou]y$/.test(b)?b.slice(0,-1)+'ied':b+'ed';
  if(suffix==='s'||suffix==='es')return /(s|x|z|ch|sh)$/.test(b)?b+'es':/[^aeiou]y$/.test(b)?b.slice(0,-1)+'ies':b+'s';
  return b+suffix;
}
function findForm(sentence,base){
  const b=base.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const stems=[b];if(/e$/.test(b))stems.push(b.slice(0,-1));if(/y$/.test(b))stems.push(b.slice(0,-1)+'i');
  if(/[^aeiou][aeiou][bdgmnprt]$/.test(b))stems.push(b+b.slice(-1));
  for(const st of stems){const re=new RegExp('\\b('+st+'(?:s|es|ed|d|ing|ies|ied)?)\\b','i');const m=sentence.match(re);
    if(m){const f=m[1];const suf=f.toLowerCase()===b?'':(f.toLowerCase().endsWith('ing')?'ing':f.toLowerCase().endsWith('ied')?'ied':f.toLowerCase().endsWith('ies')?'ies':f.toLowerCase().endsWith('ed')?'ed':f.toLowerCase().endsWith('d')?'d':f.toLowerCase().endsWith('es')?'es':'s');
      return {form:f,index:m.index,suffix:suf}}}
  return null;
}
function sameWord(sent,base,pos){
  const f=findForm(sent,base);if(!f)return false;
  const form=f.form.toLowerCase(),b=base.toLowerCase();
  // "glasses" is its own word (משקפיים), not "glass": skip forms that have their own dictionary entry
  if(form!==b&&DICT.has(form))return false;
  if(pos){const before=sent.slice(0,f.index);
    if(pos==='n'&&/\b(to|will|can|could|should|must|don't|didn't|won't|never|I|we|they|you)\s+$/i.test(before))return false;
    if(pos==='v'&&/\b(a|an|the|my|your|his|her|our|their|this|that)\s+$/i.test(before))return false;}
  return true;
}
function sentenceOptions(w){
  const e=lookup(w.en);let list=[];
  if(w.sentence&&w.sentence.trim())list.push(w.sentence.trim());
  if(e&&e.exs)list=list.concat(e.exs);
  list=list.filter(x=>sameWord(x,w.en));
  // borrow sentences of other words only when this word has very few, and only if the word is used the same way
  const pos=(e&&e.pos)||w.pos||'';
  if(list.length<3){for(const x of ALL_SENTS){if(list.length>=6)break;if(!list.includes(x)&&x.length<90&&sameWord(x,w.en,pos))list.push(x)}}
  return [...new Set(list)];
}
function startStage2(d){
  const N=Math.max(3,Math.min(6,+S.settings.bankSize||5));
  const items=shuffle(d.words).map(w=>{
    const opts=sentenceOptions(w);const last=(S.lastSent||{})[w.en.toLowerCase()];
    const pickFrom=opts.length>1?opts.filter(x=>x!==last):opts;const sent=pickFrom.length?pick(pickFrom):'';
    if(sent){S.lastSent=S.lastSent||{};S.lastSent[w.en.toLowerCase()]=sent}
    const f=sent?findForm(sent,w.en):null;
    // distractor pool
    const deckPool=d.words.filter(x=>x.en.toLowerCase()!==w.en.toLowerCase()).map(x=>x.en);
    const extraPool=DICT_LIST.filter(x=>x.en.toLowerCase()!==w.en.toLowerCase()&&!deckPool.includes(x.en)&&(!w.pos||x.pos===w.pos)).map(x=>x.en);
    let pool;
    if(S.settings.bankSource==='deck'){pool=shuffle(deckPool);if(pool.length<N-1)pool=pool.concat(shuffle(extraPool))}
    else{const half=Math.ceil((N-1)/2);pool=shuffle(deckPool).slice(0,half).concat(shuffle(extraPool))}
    const posFirst=pool.filter(x=>{const de=d.words.find(y=>y.en===x)||lookup(x);return !w.pos||(de&&de.pos===w.pos)});
    const rest=pool.filter(x=>!posFirst.includes(x));
    let distract=[...new Set(posFirst.concat(rest))].slice(0,N-1);
    let correct=w.en, options;
    if(f){correct=f.suffix?f.form.toLowerCase():w.en;
      options=shuffle([correct,...distract.map(x=>f.suffix&&((d.words.find(y=>y.en===x)||lookup(x)||{}).pos===w.pos)?inflect(x,f.suffix):x)]);}
    else options=shuffle([w.en,...distract]);
    return {w,sent,f,correct,options};
  });
  save();
  R={deck:d.id,stage:2,items,i:0,results:[],state:'ask',tries:0,wrongPicked:[]};
  go('s2');
}
function tokenize(text,skipIndex,skipLen){
  // returns html with clickable word tokens; blank at skipIndex
  let html='';let i=0;
  const re=/[A-Za-z][A-Za-z'\-]*/g;let m;
  while((m=re.exec(text))){
    if(skipIndex!=null&&m.index===skipIndex){html+=esc(text.slice(i,m.index))+'%%BLANK%%';i=m.index+skipLen;re.lastIndex=i;continue}
    html+=esc(text.slice(i,m.index))+`<span class="tok" data-tok="${esc(m[0])}">${esc(m[0])}</span>`;i=m.index+m[0].length}
  return html+esc(text.slice(i));
}
VIEWS.s2=()=>{
  const it=R.items[R.i];const done=R.state!=='ask';const pct=Math.round((R.i+1)/R.items.length*100);
  const blank=`<span class="blank ${done?'ok':''}">${done?esc(it.f?it.f.form:it.w.en):'&nbsp;?&nbsp;'}</span>`;
  const body=it.f?tokenize(it.sent,it.f.index,it.f.form.length).replace('%%BLANK%%',blank)
    :`<span dir="rtl" style="font-family:var(--f-body);font-size:1.1rem">איזו מילה פירושה: <b>${esc(it.w.he)}</b>?</span><br>${blank}`;
  return `
  <div class="top"><button class="back" data-act="quit">✕ יציאה</button><span class="chip">השלימי את המשפט</span></div>
  <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted">${R.i+1}/${R.items.length}</span></div>
  <div class="panel" style="padding:22px 18px">
    <div class="sentence" id="sent">${body}</div>
    <div class="row between"><span class="small muted">${it.f?'לא מכירה מילה? לחצי עליה לפירוש':'למילה הזאת אין עדיין משפט במילון'}</span>${it.f&&done?`<button class="btn-icon" style="background:var(--pop);color:var(--pop-ink)" data-act="saysent" aria-label="השמעת המשפט">▶</button>`:''}</div>
  </div>
  <div class="bank" id="bank">${it.options.map(o=>`<button data-opt="${esc(o)}" class="${done&&o===it.correct?'right':R.wrongPicked.includes(o)?'wrong':''}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${done?`<div class="feedback ${R.tries===1?'good':'close'}">${R.tries===1?pick(OK_SHORT):'מצאת את זה! המילה: '+esc(it.w.en)+' = '+esc(it.w.he)}</div>
  <button class="btn-pop btn-wide" data-act="next">${R.i+1<R.items.length?'הבא ←':'לתוצאות'}</button>`:''}`;
};
BIND.s2=()=>{
  const it=R.items[R.i];
  $('#app').onclick=e=>{
    const tok=e.target.closest('[data-tok]');if(tok){showWordPop(tok.dataset.tok);return}
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.opt){R.tries++;
      if(b.dataset.opt.toLowerCase()===it.correct.toLowerCase()){R.state='shown';R.results.push({w:it.w,ok:R.tries===1});
        const d=deckById(R.deck);const s=d.stats[it.w.en]||(d.stats[it.w.en]={c:0,x:0,streak:0});if(R.tries===1){s.c++;s.s2=true}else{s.x++;s.s2=false}save();
        render();if(S.settings.autoSpeak&&it.f)setTimeout(()=>speak(it.sent),300)}
      else{R.wrongPicked.push(b.dataset.opt);b.classList.add('wrong','shake');b.disabled=true}
      return}
    const a=b.dataset.act;
    if(a==='saysent')speak(it.sent);
    if(a==='quit')go('deck',{id:R.deck});
    if(a==='next'){R.i++;R.state='ask';R.tries=0;R.wrongPicked=[];if(R.i>=R.items.length)finishS2();else render()}
  };
};
function finishS2(){
  const d=deckById(R.deck);const n=R.results.length,ok=R.results.filter(r=>r.ok).length;const p=Math.round(ok/n*100);
  bumpStreak();d.history.push({date:Date.now(),stage:2,score:p,total:n});d.best.stage2=Math.max(d.best.stage2||0,p);save();
  go('result',{stage:2,p,ok,n,newUnlock:false,mistakes:R.results.filter(r=>!r.ok)});
}
/* word popover: tap any word to translate, and add it to the deck */
function showWordPop(word){
  closePop();const e=lookup(word);const d=deckById(R.deck);
  const inDeck=d&&d.words.some(w=>lemmas(word).includes(w.en.toLowerCase()));
  const el=document.createElement('div');el.className='pop';el.id='pop';
  el.innerHTML=`<div class="row between"><b class="en" style="font-size:1.4rem">${esc(e?e.en:word)}</b><button class="btn-icon" style="background:var(--pop);color:var(--pop-ink)" data-p="say">▶</button></div>
    <div style="font-size:1.15rem">${e?esc(e.he.slice(0,3).join(', ')):'המילה הזאת עוד לא במילון שלי'}</div>
    <div class="row">${e&&!inDeck&&d?`<button class="btn-mint" data-p="add">+ הוספה לחפיסה</button>`:''}<button data-p="close">סגירה</button></div>`;
  document.body.appendChild(el);
  speak(e?e.en:word);
  el.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.p==='say')speak(e?e.en:word);
    if(b.dataset.p==='close')closePop();
    if(b.dataset.p==='add'){d.words.push({en:e.en,he:e.he.slice(0,3).join(', '),sentence:'',pos:e.pos});save();toast(`"${e.en}" נוספה לחפיסה ✓`);closePop()}};
}
function closePop(){const p=$('#pop');if(p)p.remove()}

function downloadBackup(){
  if(location.protocol!=='file:'&&/claude/.test(location.hostname+document.referrer)){toast('בתצוגה כאן אי אפשר לשמור קובץ. בקובץ שבטלפון זה עובד. בינתיים השתמשי בקוד הגיבוי.');return}
  try{S.lastBackup=Date.now();save();
    const blob=new Blob([JSON.stringify({app:'noa-english',backup:S})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noa-english-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('קובץ הגיבוי נשמר בהורדות ✓');
  }catch(e){toast('לא הצלחתי לשמור קובץ כאן. השתמשי בקוד הגיבוי.')}
}
function restoreFrom(text){
  text=String(text||'').trim();let o;
  if(text.startsWith('{'))o=JSON.parse(text);else o=decodeShare(text);
  if(!o||!o.backup)throw new Error('bad');
  S={...o.backup,settings:{...DEFAULT_SETTINGS,...o.backup.settings}};save();
}
BIND.settings=()=>{const s=S.settings;
  const rf=$('#restoreFile');if(rf)rf.onchange=()=>{const f=rf.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{restoreFrom(r.result);toast('הגיבוי שוחזר ✓');go('home')}catch(e){toast('הקובץ הזה לא נראה כמו גיבוי של האפליקציה')}};r.readAsText(f)};
  const segs={smode:'stage1Mode',sbank:'bankSize',ssrc:'bankSource'};
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    const seg=b.closest('.seg');if(seg&&segs[seg.id]){s[segs[seg.id]]=seg.id==='sbank'?+b.dataset.v:b.dataset.v;save();
      seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
    if(b.dataset.act==='back')go('home');
    if(b.dataset.act==='test')speak('Hello Noa, you are amazing');
    if(b.dataset.act==='backupfile'){downloadBackup();return}
    if(b.dataset.act==='backup'){S.lastBackup=Date.now();save();const c=encodeShare({backup:S});$('#bbox').innerHTML=`<code class="share" id="code">${esc(c)}</code>`;copyText(c,$('#code'))}
  };
  $('#sname').oninput=e=>{s.name=e.target.value;save()};
  $('#sthr').oninput=e=>{s.threshold=+e.target.value;$('#thrv').textContent=s.threshold+'%';save()};
  $('#srate').oninput=e=>{s.rate=+e.target.value;$('#ratev').textContent=rateLabel(s.rate);save()};
  $('#srate').onchange=()=>speak('Hello Noa, this is my speed');
  $('#sauto').onchange=e=>{s.autoSpeak=e.target.checked;save()};
  $('#svoice').onchange=e=>{s.voiceURI=e.target.value;save()};
};

/* ============ ui bits ============ */
let toastT;
function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600)}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti');c.hidden=false;const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#D6334C','#F4B6C0','#FFFFFF','#E8A598'];
  const ps=Array.from({length:120},()=>({x:W/2,y:H/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<110)requestAnimationFrame(tick);else{x.clearRect(0,0,W,H);c.hidden=true}})();
}
